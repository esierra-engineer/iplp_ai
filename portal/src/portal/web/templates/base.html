<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}PLP Case Portal{% endblock %}</title>
  <script src="/static/htmx.min.js"></script>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f7f7f8; color: #1a1a1a; }
    header { background: #1f2933; color: #fff; padding: 0.75rem 1.5rem; display: flex; align-items: center; gap: 1.5rem; }
    header a { color: #cbd2d9; text-decoration: none; font-size: 0.95rem; }
    header a:hover { color: #fff; }
    header .brand { color: #fff; font-weight: 600; margin-right: 1rem; }
    main { padding: 1.5rem; max-width: 1100px; margin: 0 auto; }
    table { border-collapse: collapse; width: 100%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    th, td { padding: 0.4rem 0.65rem; border-bottom: 1px solid #e4e7eb; text-align: left; font-size: 0.9rem; }
    th { background: #edf0f2; }
    tr:hover td { background: #fbfbfc; }
    form.inline { display: inline; }
    input, select { padding: 0.3rem 0.4rem; border: 1px solid #cbd2d9; border-radius: 3px; }
    button, .btn { padding: 0.35rem 0.8rem; border: 1px solid #345; background: #345; color: #fff; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; font-size: 0.85rem; }
    button.danger, .btn.danger { background: #b00020; border-color: #b00020; }
    .card { background: #fff; padding: 1rem 1.25rem; margin-bottom: 1rem; box-shadow: 0 1px 2px rgba(0,0,0,.08); border-radius: 4px; }
    .muted { color: #666; font-size: 0.85rem; }
    .flash { background: #eef7ee; border: 1px solid #b7dfb7; padding: 0.5rem 0.9rem; border-radius: 4px; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <header>
    <span class="brand">PLP Case Portal</span>
    {% if case %}
      <a href="/cases/{{ case.id }}">Overview</a>
      <a href="/cases/{{ case.id }}/buses">Buses</a>
      <a href="/cases/{{ case.id }}/lines">Lines</a>
      <a href="/cases/{{ case.id }}/stages">Stages</a>
      <a href="/cases/{{ case.id }}/plants">Plants</a>
      <a href="/cases/{{ case.id }}/batteries">Batteries</a>
      <a href="/cases/{{ case.id }}/projects">Projects</a>
      <a href="/cases/{{ case.id }}/thermal-costs">Thermal Costs</a>
      <a href="/cases/{{ case.id }}/basin-conventions">Basin Conventions</a>
      <a href="/cases/{{ case.id }}/generate">Generate .dat files</a>
    {% endif %}
    <a href="/cases" style="margin-left:auto">All cases</a>
  </header>
  <main>
    {% if request.query_params.get('msg') %}
      <div class="flash">{{ request.query_params.get('msg') }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
